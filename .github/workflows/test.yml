name: 測試

# 這份設定就是第 13、14 章講的「真正的跨平台驗證」:
# 教材裡所有關於編碼、路徑、換行的主張,都會在 Windows / macOS / Linux 上被實際驗證一次。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 🪟 Windows 的標準輸出預設不是 UTF-8,印中文會 UnicodeEncodeError。
  # 程式本身已經用 sys.stdout.reconfigure() 自保,這裡再加一層保險。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # 範例專案的測試 —— 三個作業系統 × 兩個 Python 版本
  examples:
    name: examples (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 不需安裝任何東西的測試執行器
        working-directory: examples
        run: python run_tests.py --doctest

      - name: 安裝 pytest
        run: python -m pip install --upgrade pip pytest

      - name: pytest（含 doctest）
        working-directory: examples
        run: python -m pytest

      - name: CLI 冒煙測試
        working-directory: examples
        run: |
          python -m drinkshop.cli demo --count 5
          python -m drinkshop.cli seed 資料 --days 3
          python -m drinkshop.cli report 資料

  # 教材 notebook —— 實際執行每一本,確保教材裡的程式碼真的跑得動
  notebooks:
    name: notebooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝執行 notebook 所需套件
        run: python -m pip install --upgrade pip nbformat nbclient ipykernel pytest

      - name: 產生並實際執行所有 notebook
        run: python tools/build_notebooks.py --check

      - name: 確認產生的 notebook 與 src 同步
        shell: bash
        run: |
          if [ -n "$(git status --porcelain notebooks/)" ]; then
            echo "::error::notebooks/*.ipynb 與 notebooks/src/*.py 不同步，請在本機執行 python3 tools/build_notebooks.py 後重新 commit"
            git status --porcelain notebooks/
            exit 1
          fi
